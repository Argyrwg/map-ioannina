<!DOCTYPE html>
<html>
<head>

	 <title> Basic Google Map </title>
	 <style> 
	  #map {
	    height:400px;
	    width:100%;
	    border:1px solid #ccc;
	       }
	  </style>

	 </head>
	 
 <body>
   <h1> My google Map </h1>
   <div id="map"> </div>

   <script>
   
    function initMap() {
     //Create new map centered on Ioannina
     const map = new google.maps.Map(document.getElementById("map"),{
     center : {lat :39.6640 , lng: 20.8520} ,
     zoom:12,
     mapTypeId: "hybrid"
     });
     }

     
     </script>
     <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP3IQuOEPqFITzjRCQUiMAL6iUVN94vjw&callback=initMap" >
       </script>
       </body>
       </html>
